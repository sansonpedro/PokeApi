<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Pokedex</h1>
      <input type="text" id="searchInput" placeholder="Buscar Pokémon..." />
    </header>

    <main>
      <div id="loading">Carregando...</div>
      <div id="pokedexContainer" class="pokedex-container"></div>
    </main>

    <div id="pokemonModal" class="modal hidden">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2 id="modalName"></h2>
        <img id="modalImage" src="" alt="Pokemon" />
        <div id="modalTypes" class="types"></div>
        <div id="modalStats" class="stats"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
