<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Pokedex</h1>
      <input type="text" id="searchInput" placeholder="Buscar Pokémon..." />
    </header>

    <main>
      <div id="loading">Carregando...</div>
      <div id="pokedexContainer" class="pokedex-container"></div>

      <div id="pokemonDetails" class="pokemon-details hidden">
        <h2 id="detailName"></h2>
        <img id="detailImage" src="" alt="Pokemon" />
        <div id="detailTypes" class="types"></div>
        <div id="detailStats" class="stats"></div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
